name: Sync releases

# Keeps the Releases page in step with the app. Runs every hour, and by hand from the Actions tab. It reads the
# published releases of the app, rebuilds the site, and commits any change to main.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Only one sync runs at a time. A run that starts while another is in flight waits for it to finish rather
# than cancelling it, so overlapping runs cannot both reach the commit step at once.
concurrency:
  group: sync-releases
  cancel-in-progress: false

# Read-only by default. The build job reads and builds with no write access, and saves its changes as a patch.
# Only the commit job, which applies that patch and pushes it, has write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read the app's releases
        run: python3 tools/sync_releases.py
      - name: Build the site
        run: python3 tools/build.py --check-release
      - name: Save any change as a patch
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes.patch

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes
      - name: Commit any change
        run: |
          if [ ! -s "$RUNNER_TEMP/changes/changes.patch" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Apply the patch on top of the main that exists now, not the commit this run started from. If main
          # has moved in a way the patch no longer fits, leave it for the next run to rebuild.
          git fetch origin main
          git checkout -B main origin/main
          if ! git apply --index "$RUNNER_TEMP/changes/changes.patch"; then
            echo "Main has moved and the patch no longer applies; the next run will rebuild."
            exit 0
          fi
          git commit -m "Sync releases from the Library app"
          # Another push may land between the fetch above and here; rebase onto it and retry once.
          if ! git push origin main; then
            git pull --rebase origin main
            git push origin main
          fi
